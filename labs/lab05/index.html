<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Лабораторна робота №5</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            place-items: center;
            background: #f3f7fa;
            color: #17384f;
            font-family:
                Inter,
                Arial,
                sans-serif;
        }

        main {
            width: min(100%, 720px);
            padding: 42px;
            border: 1px solid #cfdee6;
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 16px 40px rgba(21, 56, 77, 0.1);
        }

        .label {
            margin: 0 0 12px;
            color: #0e87a8;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            line-height: 1.15;
        }

        p {
            margin: 0 0 26px;
            color: #607483;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        a {
            display: inline-flex;
            min-height: 46px;
            align-items: center;
            justify-content: center;
            padding: 11px 18px;
            border-radius: 9px;
            background: #173c55;
            color: #ffffff;
            font-weight: 750;
            text-decoration: none;
        }

        a:hover,
        a:focus-visible {
            background: #0e87a8;
        }
    </style>
</head>

<body>
    <main>
        <p class="label">Лабораторна робота №5</p>

        <h1>Матеріали готуються</h1>

        <p>
            Інтерактивний модуль лабораторної роботи №5
            перебуває на етапі розроблення.
        </p>

        <a href="../../">
            Повернутися до переліку робіт
        </a>
    </main>
</body>
</html>
